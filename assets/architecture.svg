<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="manager" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="planner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="coder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="executor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="reviewer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="git" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="1">AUTO-SWE-AGENT — MULTI-AGENT ARCHITECTURE</text>
  <line x1="200" y1="52" x2="1000" y2="52" stroke="#334155" stroke-width="1"/>

  <!-- ===== LANE LABELS ===== -->
  <text x="60" y="90" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle" transform="rotate(-90,60,90)">LLM LAYER</text>
  <line x1="100" y1="65" x2="100" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="60" y="490" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle" transform="rotate(-90,60,490)">TOOL LAYER</text>
  <line x1="100" y1="400" x2="100" y2="600" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="60" y="780" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle" transform="rotate(-90,60,780)">INFRA LAYER</text>
  <line x1="100" y1="620" x2="100" y2="870" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== LLM LAYER ===== -->

  <!-- Row labels -->
  <text x="115" y="88" fill="#64748b" font-size="10" font-weight="600">INVOCATION</text>

  <!-- User Task node -->
  <rect x="120" y="98" width="220" height="54" rx="27" fill="#334155" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="120" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">🐛 User Task</text>
  <text x="230" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">Natural language issue description</text>

  <!-- Arrow User -> Manager -->
  <line x1="340" y1="125" x2="420" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Manager -->
  <rect x="430" y="88" width="200" height="54" rx="10" fill="url(#manager)" filter="url(#shadow)"/>
  <text x="530" y="110" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">🧠 Manager Agent</text>
  <text x="530" y="128" text-anchor="middle" fill="#c7d2fe" font-size="10">flash-lite · complexity analysis</text>

  <!-- Arrow Manager -> Planner -->
  <line x1="630" y1="115" x2="710" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="107" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">COMPLEXITY + PLAN</text>

  <!-- Planner -->
  <rect x="720" y="88" width="200" height="54" rx="10" fill="url(#planner)" filter="url(#shadow)"/>
  <text x="820" y="110" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">📋 Planner Agent</text>
  <text x="820" y="128" text-anchor="middle" fill="#ddd6fe" font-size="10">flash · implementation steps</text>

  <!-- Arrow Planner -> Coder -->
  <line x1="920" y1="115" x2="1000" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="107" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">STEPS</text>

  <!-- Coder -->
  <rect x="720" y="175" width="200" height="54" rx="10" fill="url(#coder)" filter="url(#shadow)"/>
  <text x="820" y="197" text-anchor="middle" fill="#1c1917" font-size="13" font-weight="700">💻 Coder Agent</text>
  <text x="820" y="215" text-anchor="middle" fill="#78350f" font-size="10">flash · code implementation</text>

  <!-- Arrow Coder -> Executor -->
  <line x1="820" y1="229" x2="820" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845" y="278" fill="#64748b" font-size="9" font-style="italic">tool calls</text>

  <!-- ===== TOOL LAYER ===== -->

  <text x="115" y="410" fill="#64748b" font-size="10" font-weight="600">EXECUTION</text>

  <!-- Executor -->
  <rect x="430" y="415" width="200" height="54" rx="10" fill="url(#executor)" filter="url(#shadow)"/>
  <text x="530" y="437" text-anchor="middle" fill="#022c22" font-size="13" font-weight="700">⚡ Executor</text>
  <text x="530" y="455" text-anchor="middle" fill="#065f46" font-size="10">ToolNode · docker sandbox</text>

  <!-- Tool boxes -->
  <rect x="720" y="402" width="170" height="78" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="805" y="422" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">AVAILABLE TOOLS</text>
  <line x1="735" y1="430" x2="875" y2="430" stroke="#334155" stroke-width="1"/>
  <text x="805" y="446" text-anchor="middle" fill="#94a3b8" font-size="9">📄 read_file / write_to_file</text>
  <text x="805" y="460" text-anchor="middle" fill="#94a3b8" font-size="9">🔍 search_codebase</text>
  <text x="805" y="474" text-anchor="middle" fill="#94a3b8" font-size="9">🔎 semantic_search (RAG)</text>

  <!-- Arrow Executor -> Coder (loop back) -->
  <path d="M 430 444 L 360 444 L 360 202 L 720 202" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Hallucination guard label -->
  <rect x="250" y="462" width="140" height="20" rx="4" fill="#7c2d12" opacity="0.9"/>
  <text x="320" y="476" text-anchor="middle" fill="#fdba74" font-size="8" font-weight="700">🛡️ HALLUCINATION GUARD</text>
  <text x="320" y="486" text-anchor="middle" fill="#fdba74" font-size="7">No writes → force back to Coder</text>

  <!-- Arrow Executor -> Verify -->
  <line x1="630" y1="444" x2="710" y2="444" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="436" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">result</text>

  <!-- Verify -->
  <rect x="720" y="415" width="200" height="54" rx="10" fill="url(#verify)" filter="url(#shadow)"/>
  <text x="820" y="437" text-anchor="middle" fill="#164e63" font-size="13" font-weight="700">🧪 Verify</text>
  <text x="820" y="455" text-anchor="middle" fill="#155e75" font-size="10">pytest · max 3 retries</text>

  <!-- Verify failure -> Coder (loop back) -->
  <path d="M 820 469 L 820 510 L 100 510 L 100 202 L 720 202" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowR)"/>
  <rect x="770" y="495" width="100" height="16" rx="4" fill="#7f1d1d" opacity="0.9"/>
  <text x="820" y="507" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="700">FAIL (&lt; 3 retries)</text>

  <!-- Verify pass -> Reviewer -->
  <line x1="920" y1="444" x2="1000" y2="444" stroke="#34d399" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="960" y="436" text-anchor="middle" fill="#34d399" font-size="9" font-style="italic">PASS</text>

  <!-- ===== INFRA LAYER (bottom) ===== -->

  <text x="115" y="640" fill="#64748b" font-size="10" font-weight="600">VALIDATION &amp; PERSISTENCE</text>

  <!-- Reviewer -->
  <rect x="120" y="650" width="200" height="54" rx="10" fill="url(#reviewer)" filter="url(#shadow)"/>
  <text x="220" y="672" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">👁️ Reviewer Agent</text>
  <text x="220" y="690" text-anchor="middle" fill="#fecaca" font-size="10">70B model · LGTM / NEEDS_FIX</text>

  <!-- Arrow Review -> Coder (NEEDS_FIX) -->
  <path d="M 320 677 L 360 677 L 360 202 L 720 202" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowR)"/>
  <rect x="350" y="658" width="90" height="16" rx="4" fill="#7f1d1d" opacity="0.9"/>
  <text x="395" y="670" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="700">NEEDS_FIX</text>

  <!-- Arrow Review -> Git -->
  <line x1="320" y1="677" x2="410" y2="677" stroke="#34d399" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Git Workflow -->
  <rect x="420" y="650" width="200" height="54" rx="10" fill="url(#git)" filter="url(#shadow)"/>
  <text x="520" y="672" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">🔧 Git Workflow</text>
  <text x="520" y="690" text-anchor="middle" fill="#d1d5db" font-size="10">branch · commit · PR description</text>

  <!-- Arrow Git -> End -->
  <line x1="620" y1="677" x2="700" y2="677" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End -->
  <rect x="710" y="650" width="140" height="54" rx="27" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="780" y="682" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">✅ Done</text>

  <!-- Verify fail >= 3 -> End -->
  <path d="M 820 510 L 820 530 L 780 530 L 780 650" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <rect x="711" y="528" width="100" height="16" rx="4" fill="#7f1d1d" opacity="0.9"/>
  <text x="761" y="540" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="700">≥ 3 retries → END</text>

  <!-- ===== LEGEND ===== -->
  <rect x="920" y="650" width="260" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1050" y="670" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">LEGEND</text>
  <line x1="935" y1="678" x2="1165" y2="678" stroke="#334155" stroke-width="1"/>
  <circle cx="945" cy="694" r="5" fill="#34d399"/><text x="958" y="698" fill="#94a3b8" font-size="9">Pass / LGTM flow</text>
  <circle cx="945" cy="712" r="5" fill="#f87171"/><text x="958" y="716" fill="#94a3b8" font-size="9">Failure / retry flow</text>
  <circle cx="945" cy="730" r="5" fill="#64748b"/><text x="958" y="734" fill="#94a3b8" font-size="9">Standard flow</text>

  <!-- Fallback chain box -->
  <rect x="920" y="755" width="260" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1050" y="773" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">⚡ FALLBACK CHAIN</text>
  <line x1="935" y1="780" x2="1165" y2="780" stroke="#334155" stroke-width="1"/>
  <text x="1050" y="796" text-anchor="middle" fill="#94a3b8" font-size="9">
    flash → flash-lite → llama-70b → llama-8b
  </text>
  <text x="1050" y="808" text-anchor="middle" fill="#64748b" font-size="8">circuit breaker · exponential backoff</text>

  <!-- Bottom bar -->
  <line x1="120" y1="845" x2="1080" y2="845" stroke="#334155" stroke-width="1"/>
  <text x="600" y="870" text-anchor="middle" fill="#475569" font-size="9">LangGraph Orchestration · LiteLLM Routing · Docker Sandbox · RAG Semantic Search · Langfuse Observability</text>
</svg>
