[project]
name = "auto-swe-agent"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "tools*", "tracking*", "resilience*", "observability*", "indexing*", "swe_bench*", "eval*", "ui*", "docstream*"]

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"
